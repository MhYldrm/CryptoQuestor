name: crypto_questor
description: "New Gen Crypto Portfolio"
publish_to: 'none'
version: 1.0.1+2


environment:
  sdk: '>=3.4.4 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  #Core
  firebase_core: ^3.5.0
  json_annotation:
  equatable:
  provider:
  get_it:


  flutter_localizations:
    sdk: flutter

  #Utils
  syncfusion_flutter_charts: # Create chart for price of history
  font_awesome_flutter: ^10.7.0
  flutter_launcher_icons: ^0.13.1
  random_string: ^2.3.1
  intl: ^0.19.0
  auto_size_text: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  carousel_slider: ^5.0.0
  google_fonts: ^6.2.1
  animated_toggle_switch: ^0.8.4

  #Service
  http: ^1.2.2
  url_launcher: ^6.3.0
  cloud_firestore:
  firebase_auth:
  dio:


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  very_good_analysis: ^6.0.0
  json_serializable:
  build_runner:


flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/ic_launcher.png"
  min_sdk_android: 21

flutter:
